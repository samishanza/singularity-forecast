name: Nightly refit

on:
  schedule:
    - cron: "17 7 * * *"   # 07:17 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["events/events.yaml", "forecast/**"]

permissions:
  contents: write

concurrency:
  group: refit
  cancel-in-progress: false

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: Download data
        run: python -m forecast.fetch
      - name: Refit and rebuild site data
        # sensitivity and backtest are cheap enough to refresh every night
        run: python -m forecast.build --sensitivity --backtest
      - name: Commit updated forecast
        run: |
          git config user.name "singularity-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Nightly refit $(date -u +%Y-%m-%d)"
          git push
